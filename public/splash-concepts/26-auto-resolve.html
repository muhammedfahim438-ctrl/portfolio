<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concept 26 · Auto-Resolve</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{ --ink:#0d120e; --accent:#aac8a7; --acc2:#c3edc0; --text:#eef3ea; --muted:#6d8a70; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;cursor:default}
  .hud{position:fixed;top:22px;left:24px;z-index:30;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
  .hud a{color:var(--muted);text-decoration:none}.hud a:hover{color:var(--acc2)}
  .bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(55% 45% at 50% 45%, rgba(170,200,167,.08), transparent 70%)}
  .field{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:0 5vw}
  .row{display:flex;flex-wrap:wrap;justify-content:center;gap:.04em}
  .char{font-family:'JetBrains Mono',monospace;font-size:clamp(1.6rem,7vw,4rem);color:var(--acc2);min-width:.62em;will-change:transform,opacity}
  .char.ok{color:var(--text)}
  .row.big .char{font-family:'Syne',sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(2.2rem,9vw,5.4rem)}
  .sub{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);margin-top:36px;opacity:0}
  .ctl{display:flex;gap:14px;margin-top:26px}
  .btn{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);background:var(--acc2);border:none;border-radius:99px;padding:12px 22px;cursor:pointer;text-decoration:none}
  .btn.ghost{color:var(--muted);background:transparent;border:1px solid rgba(170,200,167,.3)}
  .dash{width:min(360px,60vw);height:2px;background:rgba(170,200,167,.18);margin-top:26px;overflow:hidden;border-radius:2px}
  .dash i{display:block;height:100%;width:100%;background:var(--acc2);transform:translateX(-100%)}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001s !important;transition-duration:.001s !important}}
</style>
</head>
<body>
  <div class="hud"><a href="index.html">⬅ All concepts</a>&nbsp;&nbsp;/&nbsp;&nbsp;CONCEPT 26 · AUTO-RESOLVE</div>
  <div class="bgfx"></div>

  <div class="field">
    <div class="row" id="row"></div>
    <div class="sub" id="sub">decoding identity…</div>
    <div class="dash"><i id="dash"></i></div>
    <div class="ctl" style="opacity:0" id="ctl">
      <a class="btn" href="index.html">all concepts</a>
      <button class="btn ghost" onclick="location.reload()">re-scramble</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
  <script>
  const a = window.anime;
  const FINAL = "MUHAMMED FAHIM";
  const GLYPHS = "!<>-_\\/[]{}—=+*^?#________";
  const chars = FINAL.split("");

  const row = document.getElementById("row");
  const els = chars.map((c) => {
    const s = document.createElement("span");
    s.className = "char";
    s.textContent = "?";
    row.appendChild(s);
    return s;
  });
  els.forEach((el, i) => { el.dataset.i = i; });

  const glyph = (target) => (Math.random() < .35 ? GLYPHS[Math.floor(Math.random() * GLYPHS.length)] : target);

  let started = false;
  function scramble() {
    els.forEach((el, i) => el.classList.remove("ok"));
    const dur = 1900, t0 = performance.now();
    const run = () => {
      const e = (performance.now() - t0) / dur;
      if (e >= 1) { resolve(); return; }
      els.forEach((el, i) => {
        if (Math.random() < (1.2 - e)) el.textContent = glyph(FINAL[i]);
      });
      requestAnimationFrame(run);
    };
    requestAnimationFrame(run);
  }

  function resolve() {
    els.forEach((el, i) => el.textContent = FINAL[i]);
    a.animate(els, {
      scale: [1.4, 1], opacity: [0, 1],
      duration: 520, ease: "outBack", delay: a.stagger(46)
    });
    setTimeout(() => {
      els.forEach(el => el.classList.add("ok"));
      document.getElementById("sub").textContent = "identity resolved ✓";
      document.getElementById("dash").style.transition = "transform 1.1s cubic-bezier(.6,0,.2,1)";
      document.getElementById("dash").style.transform = "translateX(0)";
      setTimeout(() => {
        document.getElementById("ctl").style.transition = "opacity .6s ease";
        document.getElementById("ctl").style.opacity = 1;
      }, 850);
    }, 450);
  }

  /* real readiness gate */
  Promise.all([document.fonts.ready, new Promise(r => setTimeout(r, 700))]).then(() => {
    if (!started) { started = true; scramble(); }
  });
  document.addEventListener("keydown", () => { if (!started) { started = true; scramble(); } });
  document.addEventListener("pointerdown", () => { if (!started) { started = true; scramble(); } });
  </script>
</body>
</html>
