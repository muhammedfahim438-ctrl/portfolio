<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concept 15 · Heartbeat Trace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{ --bg:#060a08; --ink:#eef3ec; --muted:#93a093; --accent:#aac8a7; --acc2:#c3edc0; --line:#12241a; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;overflow:hidden;cursor:default}
  .hud{position:fixed;top:22px;left:24px;z-index:6;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
  .hud a{color:var(--muted);text-decoration:none}
  .hud a:hover{color:var(--acc2)}
  canvas{position:fixed;inset:0;z-index:1}
  .bpm{position:fixed;right:28px;bottom:24px;z-index:5;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--muted)}
  .bpm .big{font-size:clamp(2rem,5vw,3.4rem);color:var(--acc2);line-height:1}
  .bpm .cap{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;margin-top:8px}
  .label{position:fixed;left:0;right:0;top:18vh;text-align:center;font-family:'Inter',sans-serif;font-weight:300;font-size:.72rem;letter-spacing:.5em;text-transform:uppercase;color:var(--muted);opacity:0}
  .name{position:fixed;left:0;right:0;bottom:18vh;text-align:center;font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.6rem,5.5vw,4rem);text-transform:uppercase;letter-spacing:.2em;color:var(--ink);opacity:0;text-shadow:0 0 30px rgba(170,200,167,.35)}
  .name .alt{color:var(--acc2)}
  .start{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:6;display:none;gap:14px;align-items:center}
  .start button{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;color:var(--bg);background:var(--acc2);border:none;border-radius:99px;padding:11px 22px;cursor:pointer}
  .start a{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);text-decoration:none}
  .start a:hover{color:var(--acc2)}
  .fade{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%, transparent 60%, rgba(4,7,5,.7) 100%)}
</style>
</head>
<body>
  <div class="hud"><a href="index.html">⬅ All concepts</a>&nbsp;&nbsp;/&nbsp;&nbsp;CONCEPT 15 · HEARTBEAT TRACE</div>
  <canvas id="cv"></canvas>
  <div class="fade"></div>
  <div class="bpm"><div class="big" id="bpm">72</div><div class="cap">beats per min</div></div>
  <div class="label" id="label">signal : identity</div>
  <div class="name" id="name">MUHAMMED<span class="alt"> FAHIM </span>M</div>

  <div class="start" id="start">
    <button onclick="location.reload()">Replay</button>
    <a href="index.html">other concepts</a>
  </div>

  <script>
  (async () => {
    try { if (document.fonts?.load) await document.fonts.load("800 130px Syne"); } catch (e) {}
    const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
    let W, H, dpr;
    const resolution = 3;
    let cols = [], textWeights = [];
    let fx = 0;                      /* trace head x (0..1) */

    function resize() {
      dpr = Math.min(devicePixelRatio, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      cv.style.width = W + "px"; cv.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      sample();
    }

    function sample() {
      const cw = Math.ceil(W / resolution), ch = Math.ceil(H / resolution);
      const off = document.createElement("canvas");
      off.width = W; off.height = H;
      const o = off.getContext("2d");
      o.textAlign = "center"; o.textBaseline = "middle";
      const fs = Math.min(W * .1, 165);
      o.font = `800 ${fs}px Syne, sans-serif`;
      o.fillStyle = "#fff";
      o.fillText("MFM", W / 2, H / 2);
      const data = o.getImageData(0, 0, W, H).data;
      cols = Array.from({ length: cw }, () => 0);
      textWeights = Array.from({ length: cw }, () => 0);
      for (let x = 0; x < cw; x++) {
        const px = x * resolution;
        let sum = 0, n = 0, w = 0;
        for (let y = 0; y < ch; y++) {
          const py = y * resolution;
          const a = data[(py * W + px) * 4 + 3] / 255;
          if (a > .5) { sum += y * resolution; n++; w += a; }
        }
        cols[x] = n ? sum / n : -1;
        textWeights[x] = w;
      }
    }

    addEventListener("resize", resize);
    resize();

    const trail = [];
    let passes = 0, prevFx = 0;

    setTimeout(() => document.getElementById("label").style.opacity = 1, 700);

    (function loop(t) {
      requestAnimationFrame(loop);
      ctx.fillStyle = "rgba(6,10,8,.14)";
      ctx.fillRect(0, 0, W, H);

      /* faint grid */
      ctx.strokeStyle = "rgba(170,200,167,.05)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 60; x < W; x += 60) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
      for (let y = 60; y < H; y += 60) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
      ctx.stroke();

      fx = (fx + .0021) % 1;
      if (prevFx > fx) passes++;
      prevFx = fx;
      const headX = fx * W;

      /* heartbeat: y = vertical position of glyph + wobble */
      const cx = Math.floor((fx * W) / resolution);
      const baseY = cols[cx] >= 0 ? cols[cx] : H / 2;
      const wob = Math.sin(t / 90) * 9;
      const hx = headX, hy = clamp(baseY + wob, 20, H - 20);

      /* slowly trace the glyph behind the head */
      ctx.fillStyle = "rgba(195,237,192,.16)";
      for (let x = 0; x < cols.length; x += 2) {
        const gx = x * resolution;
        if (cols[x] < 0) continue;
        if (fx >= x / cols.length)
          ctx.fillRect(gx, cols[x] - 1, resolution, 2);
      }

      /* phosphor trail behind the head */
      trail.push({ x: hx, y: hy });
      if (trail.length > 70) trail.shift();
      ctx.strokeStyle = "rgba(195,237,192,.55)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      trail.forEach((p, i) => {
        ctx.globalAlpha = (i / trail.length) * .9;
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      });
      ctx.stroke();
      ctx.globalAlpha = 1;

      /* head dot */
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "rgba(195,237,192,.95)"; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(hx, hy, 3.4, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;

      /* BPM true-ish counter */
      const bpm = Math.round(60 + Math.sin(t / 400) * 14);
      const el = document.getElementById("bpm");
      if (el.textContent !== String(bpm)) el.textContent = String(bpm);

      if (passes >= 2) document.getElementById("start").style.display = "flex";
    })(0);

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  })();
  </script>
</body>
</html>
