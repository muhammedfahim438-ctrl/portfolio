<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concept 35 · Grid Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<style>
  :root{ --ink:#0b0f0c; --accent:#aac8a7; --acc2:#c3edc0; --text:#eef3ea; --muted:#6d8a70; --cell:#1e2720; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;cursor:default}
  .hud{position:fixed;top:22px;left:24px;z-index:30;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
  .hud a{color:var(--muted);text-decoration:none}.hud a:hover{color:var(--acc2)}
  .wrap{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:0 4vw}
  .letters{display:flex;align-items:center;gap:0}
  .lbox{display:grid;grid-template-columns:repeat(5,var(--c));gap:var(--g)}
  .pad{width:var(--c)}
  .cell{width:var(--c);height:var(--c);background:var(--cell);border-radius:2px;will-change:transform,opacity}
  .cell.on{background:var(--acc2);box-shadow:0 0 10px rgba(195,237,192,.45)}
  .cell.sp{background:rgba(30,39,32,.35)}
  .boot{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin-top:40px;min-height:1.2em;opacity:0}
  .boot.show{opacity:1;transition:opacity .5s ease}
  .ctl{display:flex;gap:14px;margin-top:26px;opacity:0}
  .ctl.show{opacity:1;transition:opacity .6s ease}
  .btn{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);background:var(--acc2);border:none;border-radius:99px;padding:12px 22px;cursor:pointer;text-decoration:none}
  .btn.ghost{color:var(--muted);background:transparent;border:1px solid rgba(170,200,167,.3)}
  .err{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:40;display:none;font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.14em;color:#ffb4a6;background:rgba(40,12,8,.85);border:1px solid rgba(255,120,90,.4);border-radius:8px;padding:8px 14px;max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001s !important;transition-duration:.001s !important}}
</style>
</head>
<body>
  <div class="hud"><a href="index.html">⬅ All concepts</a>&nbsp;&nbsp;/&nbsp;&nbsp;CONCEPT 35 · GRID BUILD</div>
  <div class="err" id="err"></div>

  <div class="wrap">
    <div class="letters" id="letters"></div>
    <div class="boot" id="boot">queueing 13 glyphs · 5×7 build</div>
    <div class="ctl" id="ctl">
      <a class="btn" href="index.html">all concepts</a>
      <button class="btn ghost" onclick="location.reload()">re-build</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
  <script>
  const { anime } = window;
  const NAME = "MUHAMMED FAHIM";
  const BMP = {
    "M":["#..#.","##.##","#.#.#","#..#.","#..#.","#..#.","#..#."],
    "U":["#...#","#...#","#...#","#...#","#...#","#...#",".###."],
    "H":["#...#","#...#","#...#","#####","#...#","#...#","#...#"],
    "A":["..#..",".#.#.","#...#","#####","#...#","#...#","#...#"],
    "E":["#####","#....","#....","####.","#....","#....","#####"],
    "D":["####.","#...#","#...#","#...#","#...#","#...#","####."],
    "F":["#####","#....","#....","####.","#....","#....","#...."],
    "I":["#####","..#..","..#..","..#..","..#..","..#..","#####"]
  };
  const lettersEl = document.getElementById("letters");
  const bootEl = document.getElementById("boot");
  const ctlEl = document.getElementById("ctl");
  const errEl = document.getElementById("err");
  window.addEventListener("error", (ev) => { errEl.textContent = "⚠ " + ev.message; errEl.style.display = "block"; });

  const W = innerWidth;
  const c = Math.max(5, Math.min(16, Math.floor((W * 0.9) / (NAME.replace(/ /g, "").length * 5 + 6))));
  const g = Math.max(2, Math.floor(c * 0.4));
  document.documentElement.style.setProperty("--c", c + "px");
  document.documentElement.style.setProperty("--g", g + "px");

  function buildGrid() {
    const cells = [];
    [...NAME].forEach((ch, li) => {
      if (ch === " ") { const p = document.createElement("div"); p.className = "pad"; lettersEl.appendChild(p); return; }
      const box = document.createElement("div");
      box.className = "lbox";
      const rows = BMP[ch];
      (rows || ["#####"]).forEach((row, r) => {
        [...row].forEach((v, colI) => {
          const cell = document.createElement("div");
          cell.className = "cell" + (v === "#" ? " on" : " sp");
          const ang = (Math.random() - 0.5) * 120;
          const sc = 0.15 + Math.random() * 0.5;
          cell.style.transform = "translate(" + (Math.random() * 700 - 350).toFixed(0) + "px," + (Math.random() * 500 - 250).toFixed(0) + "px) scale(" + sc.toFixed(2) + ") rotate(" + ang.toFixed(0) + "deg)";
          box.appendChild(cell);
          cells.push(cell);
        });
      });
      lettersEl.appendChild(box);
    });
    return cells;
  }

  let finished = false;
  function complete() {
    if (finished) return; finished = true;
    bootEl.textContent = "construction complete · welcome ✓";
    bootEl.classList.add("show");
    ctlEl.classList.add("show");
  }

  function build() {
    bootEl.classList.add("show");
    const cells = buildGrid();
    if (!anime) { cells.forEach(x => x.style.transform = "none"); setTimeout(complete, 400); return; }
    anime.animate(cells, {
      translateX: 0, translateY: 0, scale: 1, rotate: 0,
      opacity: [0, 1],
      duration: 620,
      delay: (el, i) => (i % 5) * 13 + Math.floor(i / 5) * 5,
      ease: "outCubic"
    });
    setTimeout(complete, Math.max(1300, cells.length * 10));
  }

  Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 900))]).then(() => requestAnimationFrame(build));
  setTimeout(() => { if (!finished) { [...lettersEl.querySelectorAll(".cell")].forEach(x => x.style.transform = "none"); complete(); } }, 6500);
  </script>
</body>
</html>
