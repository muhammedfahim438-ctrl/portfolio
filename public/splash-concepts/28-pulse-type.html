<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concept 28 · Pulse Type</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<style>
  :root{ --ink:#0a0f0b; --accent:#aac8a7; --acc2:#c3edc0; --text:#eef3ea; --muted:#6d8a70; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;cursor:default}
  .hud{position:fixed;top:22px;left:24px;z-index:30;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
  .hud a{color:var(--muted);text-decoration:none}.hud a:hover{color:var(--acc2)}
  .bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(50% 45% at 50% 45%, rgba(170,200,167,.09), transparent 70%),
      radial-gradient(30% 30% at 80% 20%, rgba(195,237,192,.05), transparent 70%)}
  .wrap{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:0 4vw}
  #txt{font-family:'Syne',sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(2.2rem,9.5vw,6rem);line-height:1.05;letter-spacing:.02em}
  #txt .char{display:inline-block;will-change:transform,opacity;transform-origin:50% 50%}
  .sub{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.38em;text-transform:uppercase;color:var(--muted);margin-top:36px;opacity:0}
  .trace{width:min(300px,56vw);height:26px;margin-top:30px;position:relative;opacity:0}
  .trace svg{width:100%;height:100%}
  .ctl{display:flex;gap:14px;margin-top:26px;opacity:0}
  .btn{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);background:var(--acc2);border:none;border-radius:99px;padding:12px 22px;cursor:pointer;text-decoration:none}
  .btn.ghost{color:var(--muted);background:transparent;border:1px solid rgba(170,200,167,.3)}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001s !important;transition-duration:.001s !important}}
</style>
</head>
<body>
  <div class="hud"><a href="index.html">⬅ All concepts</a>&nbsp;&nbsp;/&nbsp;&nbsp;CONCEPT 28 · PULSE TYPE</div>
  <div class="bgfx"></div>

  <div class="wrap">
    <h1 id="txt">MUHAMMED FAHIM</h1>
    <div class="sub" id="sub">steady heartbeat · identity locked</div>
    <div class="trace" id="trace">
      <svg viewBox="0 0 300 26" preserveAspectRatio="none">
        <path id="line" d="M0 13 H92 L100 13 L106 4 L112 22 L118 13 H300" fill="none" stroke="#c3edc0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="ctl" id="ctl">
      <a class="btn" href="index.html">all concepts</a>
      <button class="btn ghost" onclick="location.reload()">replay</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
  <script>
  const ttxt = document.getElementById("txt");
  const subEl = document.getElementById("sub");
  const ctlEl = document.getElementById("ctl");
  const traceEl = document.getElementById("trace");

  function manualSplit() {
    const w = ttxt.textContent;
    ttxt.textContent = "";
    [...w].forEach(c => {
      const s = document.createElement("span");
      s.className = "char";
      s.textContent = c === " " ? "\u00A0" : c;
      ttxt.appendChild(s);
    });
    return [...ttxt.children];
  }

  /* name is always visible — JS only animates it */
  const staticChars = manualSplit();

  function revealAll() {
    if (window.gsap) {
      window.gsap.to(["#sub", "#trace", "#ctl"], { opacity: 1, duration: 0.7, stagger: 0.15 });
    } else {
      [subEl, traceEl, ctlEl].forEach(el => el.style.opacity = 1);
    }
  }

  function run() {
    const gsap = window.gsap;
    if (!gsap) { revealAll(); subEl.textContent = "steady heartbeat · identity locked ✓"; return; }
    try {
      let chars = staticChars;
      const S = window.SplitText;
      if (S && typeof S.create === "function") {
        try {
          const s = S.create(ttxt, { type: "chars" });
          if (s.chars && s.chars.length) chars = s.chars;
        } catch (e) { chars = staticChars; }
      }
      chars.forEach(c => c.style.willChange = "transform");

      const tl = gsap.timeline({ defaults: { ease: "power3.out" } });
      tl.from(chars, { y: "220%", opacity: 0, scale: 1.8, duration: 1.0, ease: "elastic.out(1,0.42)", stagger: 0.04 })
        .to(chars, { y: "-14%", duration: 0.9, ease: "sine.inOut", stagger: { from: "start", each: 0.04 } }, "<")
        .to(chars, { y: 0, duration: 0.45, ease: "back.out(2)", stagger: { from: "end", each: 0.035 } }, "<+=0.1");

      const n = chars.length;
      [0, 1].forEach((beat) => {
        tl.add(() => {
          gsap.fromTo(chars, {
            scale: (i) => 1 + 0.16 * (1 - Math.abs(i - n / 2) / n),
            color: "#c3edc0"
          }, {
            scale: 1, color: "#eef3ea", duration: 0.75,
            ease: "sine.inOut", stagger: { from: "center", each: beat ? 0.04 : 0.025 },
            overwrite: true
          });
        }, beat ? "+=0.4" : "+=0.2");
      });

      tl.add(() => revealAll(), "+=0.25");
    } catch (e) { revealAll(); }
  }

  Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1000))]).then(run);
  setTimeout(revealAll, 8000);
  </script>
</body>
</html>
