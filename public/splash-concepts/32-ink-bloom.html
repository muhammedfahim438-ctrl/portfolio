<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concept 32 · Ink Bloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<style>
  :root{ --ink:#121110; --paper:#f2efe8; --dim:#7c796f; --faint:#262321;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;overflow:hidden;cursor:default}
  .hud{position:fixed;top:22px;left:24px;z-index:30;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.25em;color:var(--dim);text-transform:uppercase}
  .hud a{color:var(--dim);text-decoration:none}.hud a:hover{color:var(--paper)}
  canvas#ink{position:fixed;inset:0;z-index:2;width:100%;height:100%}
  .wrap{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:0 4vw;pointer-events:none}
  .nm{font-family:'Syne',sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(2.4rem,10vw,6rem);letter-spacing:.02em;color:var(--paper);opacity:0;mix-blend-mode:difference}
  .nm.on{opacity:1;transition:opacity 1.4s ease}
  .sub{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);margin-top:36px;opacity:0}
  .sub.on{opacity:1;transition:opacity .7s ease}
  .ctl{display:flex;gap:14px;margin-top:28px;opacity:0;pointer-events:auto}
  .ctl.on{opacity:1;transition:opacity .6s ease}
  .btn{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);background:var(--paper);border:none;border-radius:99px;padding:12px 22px;cursor:pointer;text-decoration:none}
  .btn.ghost{color:var(--paper);background:transparent;border:1px solid var(--faint)}
  .err{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:40;display:none;font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.14em;color:#ffb4a6;background:rgba(40,12,8,.85);border:1px solid rgba(255,120,90,.4);border-radius:8px;padding:8px 14px;max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001s !important;transition-duration:.001s !important}}
</style>
</head>
<body>
  <div class="hud"><a href="index.html">⬅ All concepts</a>&nbsp;&nbsp;/&nbsp;&nbsp;CONCEPT 32 · INK BLOOM</div>
  <canvas id="ink"></canvas>
  <div class="err" id="err"></div>

  <div class="wrap">
    <div class="nm" id="nm">MUHAMMED FAHIM</div>
    <div class="sub" id="sub">a drop blooms into letters</div>
    <div class="ctl" id="ctl">
      <a class="btn" href="index.html">all concepts</a>
      <button class="btn ghost" onclick="location.reload()">re-bloom</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/paper@0.12.18/dist/paper-full.min.js"></script>
  <script>
  const canvas = document.getElementById("ink");
  const nmEl = document.getElementById("nm");
  const subEl = document.getElementById("sub");
  const ctlEl = document.getElementById("ctl");
  const errEl = document.getElementById("err");
  window.addEventListener("error", (ev) => { errEl.textContent = "⚠ " + ev.message; errEl.style.display = "block"; });

  const W = innerWidth, H = innerHeight;
  const NAME = "MUHAMMED FAHIM";
  let done = false;
  function settle(label) {
    if (done) return; done = true;
    nmEl.classList.add("on");
    subEl.textContent = label || "inked · welcome ✓";
    subEl.classList.add("on");
    ctlEl.classList.add("on");
  }

  function sampleName() {
    const oc = document.createElement("canvas");
    oc.width = W; oc.height = H;
    const cx = oc.getContext("2d");
    cx.fillStyle = "#000";
    cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.font = "800 " + Math.round(Math.min(H * 0.24, W / 8)) + "px Syne, sans-serif";
    cx.fillText(NAME, W / 2, H / 2);
    const data = cx.getImageData(0, 0, W, H).data;
    const pts = [];
    const stride = 9;
    for (let y = 0; y < H; y += stride) {
      for (let x = 0; x < W; x += stride) {
        if (data[(y * W + x) * 4 + 3] > 120) pts.push([x, y]);
      }
    }
    return pts;
  }

  function bloom() {
    if (!window.paper) { setTimeout(settle, 400); return; }
    window.paper.setup(canvas);
    const radius = new window.paper.Path.Circle({ center: [W * 0.5, H * 0.42], radius: 26, fillColor: "#f2efe8" });
    radius.scale(1.02);
    const home = sampleName();
    if (home.length < 60) { settle(); return; }

    const origin = [W * 0.5, H * 0.42];
    const idx = [...home.keys()].sort(() => Math.random() - 0.5);
    const dots = [];
    home.forEach((p, i) => {
      const ang = Math.random() * Math.PI * 2;
      const R = 30 + Math.random() * Math.max(W, H) * 0.55;
      const from = [origin[0] + Math.cos(ang) * R, origin[1] + Math.sin(ang) * R];
      const d = new window.paper.Path.Circle({ center: from, radius: 1.6 + Math.random() * 1.6, fillColor: "#f2efe8" });
      const j = idx[i];
      dots.push({ d, home: p, from, t0: j * 0.0022, dur: 900 + (j % 500) * 1.4, phase: Math.random() * 9 });
    });
    const D = dots.length;

    let tAll = 0;
    window.paper.view.onFrame = (ev) => {
      tAll += 0.016;
      const off = (Math.sin(ev.time * 1.8 + 3) * 2);
      dots.forEach((o) => {
        const u = Math.min(1, (tAll - o.t0) / (o.dur / 1000));
        if (u <= 0) { o.d.visible = false; return; }
        o.d.visible = true;
        const e = 1 - Math.pow(1 - u, 3);
        const wig = (1 - u) * off;
        o.d.position.x = o.from[0] + (o.home[0] - o.from[0]) * e + wig;
        o.d.position.y = o.from[1] + (o.home[1] - o.from[1]) * e + wig * 0.6;
        o.d.opacity = Math.min(1, u * 2.2);
      });
      if (tAll > 3.6) {
        window.paper.view.onFrame = null;
        setTimeout(settle, 300);
      }
    };
    progressLog("bloom running: " + D + " ink points");
  }

  function progressLog(msg) { const st = document.getElementById("st"); if (st) st.textContent = msg; }

  Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1100))]).then(bloom);
  setTimeout(() => { if (!done) settle(); }, 6500);
  addEventListener("resize", () => {});
  </script>
</body>
</html>
