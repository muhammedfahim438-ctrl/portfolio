<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concept 41 · Origami Fold</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<style>
  :root{ --ink:#0c100c; --paperL:#e7e2d3; --paperM:#d6d0bd; --paperD:#c4bda8; --green:#3c7a4a; --acc:#c3edc0; --muted:#68775f; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--ink);color:#eef3ea;font-family:'Inter',sans-serif;overflow:hidden;cursor:default}
  .hud{position:fixed;top:22px;left:24px;z-index:30;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
  .hud a{color:var(--muted);text-decoration:none}.hud a:hover{color:var(--acc)}
  .stage{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:0 4vw}
  .scene{perspective:1500px;width:min(660px,92vw);aspect-ratio:10/6.2}
  .origami{position:relative;width:100%;height:100%;transform-style:preserve-3d}
  .face{position:absolute;top:0;height:100%;width:50.5%;backface-visibility:hidden;transform-style:preserve-3d;
    background:linear-gradient(120deg,var(--paperL),var(--paperM) 55%,var(--paperD));
    border:1px solid rgba(60,90,60,.2);box-shadow:0 12px 30px rgba(0,0,0,.3)}
  .face::before{content:"";position:absolute;inset:18px;border:1px dashed rgba(90,110,80,.4);opacity:.7}
  .face::after{content:"";position:absolute;left:0;right:0;height:26px;background:linear-gradient(to bottom,rgba(255,255,255,.14),transparent)}
  .face.l{left:0;border-radius:10px 4px 4px 10px;animation:openL 1.5s cubic-bezier(.6,-0.05,.3,1.05) .35s forwards}
  .face.r{right:0;border-radius:4px 10px 10px 4px;animation:openR 1.5s cubic-bezier(.6,-0.05,.3,1.05) .6s forwards}
  @keyframes openL{from{transform:rotateY(-120deg)}to{transform:rotateY(-6deg)}}
  @keyframes openR{from{transform:rotateY(120deg)}to{transform:rotateY(6deg)}}
  .back{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    background:linear-gradient(160deg,#0f1b12,#141f15);border-radius:12px;z-index:0;
    box-shadow:inset 0 0 0 1px rgba(195,237,192,.14)}
  .name{font-family:'Syne',sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(2rem,9.5vw,5rem);letter-spacing:.02em;line-height:1.02;color:var(--acc);text-shadow:0 0 34px rgba(195,237,192,.35)}
  .taglin{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);margin-top:22px}
  .crease{position:absolute;inset:0;z-index:2;background:repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 49.5%,rgba(40,60,40,.28) 49.5% 50.5%,rgba(0,0,0,0) 50.5% 100%);pointer-events:none;animation:creaseF 1.6s ease-out .9s forwards;opacity:0}
  @keyframes creaseF{to{opacity:1}}
  .cap{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.32em;text-transform:uppercase;color:var(--acc);margin-top:30px;opacity:0}
  .cap.show{opacity:1;transition:opacity .6s ease}
  .ctl{display:flex;gap:14px;margin-top:22px;opacity:0}
  .ctl.show{opacity:1;transition:opacity .6s ease}
  .btn{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);background:var(--acc);border:none;border-radius:99px;padding:12px 22px;cursor:pointer;text-decoration:none}
  .btn.ghost{color:var(--muted);background:transparent;border:1px solid rgba(170,200,167,.3)}
  .err{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:40;display:none;font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.14em;color:#ffb4a6;background:rgba(40,12,8,.85);border:1px solid rgba(255,120,90,.4);border-radius:8px;padding:8px 14px;max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (prefers-reduced-motion: reduce){
    .face{animation:none !important;transform:rotateY(0)}
  }
</style>
</head>
<body>
  <div class="hud"><a href="index.html">⬅ All concepts</a>&nbsp;&nbsp;/&nbsp;&nbsp;CONCEPT 41 · ORIGAMI FOLD</div>
  <div class="err" id="err"></div>

  <div class="stage">
    <div class="scene">
      <div class="origami">
        <div class="face l"></div>
        <div class="face r"></div>
        <div class="crease"></div>
        <div class="back">
          <div class="name">MUHAMMED FAHIM</div>
          <div class="taglin">developer · build · ship</div>
        </div>
      </div>
    </div>
    <div class="cap" id="cap">unfolding..</div>
    <div class="ctl" id="ctl">
      <a class="btn" href="index.html">all concepts</a>
      <button class="btn ghost" onclick="location.reload()">re-fold</button>
    </div>
  </div>

  <script>
  const capEl = document.getElementById("cap");
  const ctlEl = document.getElementById("ctl");
  const errEl = document.getElementById("err");
  window.addEventListener("error", (ev) => { errEl.textContent = "⚠ " + ev.message; errEl.style.display = "block"; });
  let done = false;
  function finish() {
    if (done) return; done = true;
    capEl.textContent = "unfolded · welcome ✓";
    capEl.classList.add("show");
    ctlEl.classList.add("show");
  }
  Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 900))]).then(() => {
    setTimeout(finish, 2100);
  });
  setTimeout(() => { if (!done) finish(); }, 6800);
  </script>
</body>
</html>
