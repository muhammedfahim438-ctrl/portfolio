<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concept 34 · Barcode Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<style>
  :root{ --ink:#0c0f0b; --white:#eef3ea; --accent:#7fffa8; --muted:#68785f; --dim:#45493f;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--ink);color:var(--white);font-family:'Inter',sans-serif;overflow:hidden;cursor:default}
  .hud{position:fixed;top:22px;left:24px;z-index:30;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
  .hud a{color:var(--muted);text-decoration:none}.hud a:hover{color:var(--accent)}
  .bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(50% 45% at 50% 45%, rgba(127,255,168,.06), transparent 70%)}
  .wrap{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:0 5vw}
  .bcbox{width:min(560px,88vw);opacity:0;transform:translateY(10px);transition:opacity .7s ease,transform .7s ease}
  .bcbox.on{opacity:1;transform:none}
  .bcbox.ok svg{opacity:0;transform:translateY(-46px);transition:opacity .6s ease,transform .6s ease}
  #barcode{width:100%;height:auto;display:block}
  .laser{position:relative;height:6px;width:100%;overflow:visible}
  .beam{position:absolute;left:0;top:0;width:56px;height:6px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(127,255,168,.95));filter:drop-shadow(0 0 6px rgba(127,255,168,.9));animation:sweep 1.7s cubic-bezier(.4,0,.6,1) forwards}
  @keyframes sweep{0%{left:-70px}60%{left:100%}100%{left:100%;opacity:.3}}
  .skew{height:2px;width:100%;background:repeating-linear-gradient(90deg,var(--dim) 0 8px,transparent 8px 16px);margin:10px 0 6px}
  .readout{position:absolute;top:50%;right:-12px;transform:translateY(-50%) translateX(100%);font-family:'JetBrains Mono',monospace;font-size:.66rem;color:var(--accent);white-space:nowrap}
  .frame{position:absolute;inset:-16px;pointer-events:none;border:1px dashed rgba(232,255,240,.14)}
  .frame i{position:absolute;width:16px;height:16px;border:2px solid var(--muted)}
  .frame i:nth-child(1){top:-3px;left:-3px;border-right:0;border-bottom:0}
  .frame i:nth-child(2){top:-3px;right:-3px;border-left:0;border-bottom:0}
  .frame i:nth-child(3){bottom:-3px;left:-3px;border-right:0;border-top:0}
  .frame i:nth-child(4){bottom:-3px;right:-3px;border-left:0;border-top:0}
  .meta{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.3em;color:var(--dim);margin-top:22px;text-transform:uppercase;min-height:1.1em}
  .nm{font-family:'Syne',sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(2.4rem,10vw,6rem);color:var(--white);letter-spacing:.02em;opacity:0;transform:translateY(-10px)}
  .nm.on{opacity:1;transform:none;transition:opacity .9s ease,transform .7s ease}
  .tag{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);margin-top:16px;opacity:0}
  .tag.on{opacity:1;transition:opacity .6s ease}
  .ctl{display:flex;gap:14px;margin-top:30px;opacity:0}
  .ctl.show{opacity:1;transition:opacity .6s ease}
  .btn{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);background:var(--white);border:none;border-radius:99px;padding:12px 22px;cursor:pointer;text-decoration:none}
  .btn.ghost{color:var(--muted);background:transparent;border:1px solid rgba(220,255,225,.25)}
  .err{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:40;display:none;font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.14em;color:#ffb4a6;background:rgba(40,12,8,.85);border:1px solid rgba(255,120,90,.4);border-radius:8px;padding:8px 14px;max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001s !important;transition-duration:.001s !important}}
</style>
</head>
<body>
  <div class="hud"><a href="index.html">⬅ All concepts</a>&nbsp;&nbsp;/&nbsp;&nbsp;CONCEPT 34 · BARCODE SCAN</div>
  <div class="bgfx"></div>
  <div class="err" id="err"></div>

  <div class="wrap">
    <div class="bcbox" id="bcbox">
      <div class="frame"><i></i><i></i><i></i><i></i></div>
      <svg id="barcode"></svg>
      <div class="laser"><div class="beam"></div></div>
      <div class="skew"></div>
      <div class="meta" id="meta">waiting for laser…</div>
    </div>
    <div class="nm" id="nm">MUHAMMED&nbsp;FAHIM</div>
    <div class="tag" id="tag"></div>
    <div class="ctl" id="ctl">
      <a class="btn" href="index.html">all concepts</a>
      <button class="btn ghost" onclick="location.reload()">re-scan</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script>
  const { JsBarcode } = window;
  const box = document.getElementById("bcbox");
  const meta = document.getElementById("meta");
  const nmEl = document.getElementById("nm");
  const tagEl = document.getElementById("tag");
  const ctlEl = document.getElementById("ctl");
  const errEl = document.getElementById("err");
  window.addEventListener("error", (ev) => { errEl.textContent = "⚠ " + ev.message; errEl.style.display = "block"; });

  const NAME = "MUHAMMED FAHIM";
  let done = false;
  function verify() {
    if (done) return; done = true;
    box.classList.add("ok");
    nmEl.classList.add("on");
    tagEl.textContent = "✓ scanned · identity verified";
    tagEl.classList.add("on");
    ctlEl.classList.add("show");
  }

  async function scan() {
    box.classList.add("on");
    if (JsBarcode) {
      try {
        JsBarcode("#barcode", NAME, { format: "CODE128", width: 2, height: 96, margin: 8, displayValue: false, lineColor: "#eef3ea", background: "transparent" });
      } catch (e) {}
      const seq = ["resolving glyphs…", "reading bars·", "decoding CODE128…", "identity found"];
      let i = 0;
      meta.textContent = seq[0];
      const iv = setInterval(() => { i++; if (i < seq.length) meta.textContent = seq[i]; else clearInterval(iv); }, 460);
    } else {
      meta.textContent = "encoder unavailable — positioning…";
    }
    setTimeout(verify, 2150);
  }

  Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 900))]).then(scan);
  setTimeout(() => { if (!done) verify(); }, 5600);
  </script>
</body>
</html>
