<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concept 40 · Force Label</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<style>
  :root{ --ink:#0b0f0c; --acc:#c3edc0; --acc2:#9ccf9a; --muted:#5f725e; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--ink);color:#eef3ea;font-family:'Inter',sans-serif;overflow:hidden;cursor:default}
  .hud{position:fixed;top:22px;left:24px;z-index:30;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
  .hud a{color:var(--muted);text-decoration:none}.hud a:hover{color:var(--acc)}
  canvas{position:fixed;inset:0;z-index:5;display:block}
  .cap{position:fixed;bottom:116px;left:50%;transform:translateX(-50%);z-index:10;font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);text-align:center;opacity:0;white-space:nowrap}
  .cap.show{opacity:1;transition:opacity .6s ease}
  .ctl{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:14px;opacity:0}
  .ctl.show{opacity:1;transition:opacity .6s ease}
  .btn{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);background:var(--acc);border:none;border-radius:99px;padding:12px 22px;cursor:pointer;text-decoration:none}
  .btn.ghost{color:var(--muted);background:transparent;border:1px solid rgba(170,200,167,.3)}
  .err{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:40;display:none;font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.14em;color:#ffb4a6;background:rgba(40,12,8,.85);border:1px solid rgba(255,120,90,.4);border-radius:8px;padding:8px 14px;max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (prefers-reduced-motion: reduce){*{transition-duration:.001s !important;animation-duration:.001s !important}}
</style>
</head>
<body>
  <div class="hud"><a href="index.html">⬅ All concepts</a>&nbsp;&nbsp;/&nbsp;&nbsp;CONCEPT 40 · FORCE LABEL</div>
  <div class="err" id="err"></div>
  <canvas id="cv"></canvas>
  <div class="cap" id="cap">binding swarm to signature…</div>
  <div class="ctl" id="ctl">
    <a class="btn" href="index.html">all concepts</a>
    <button class="btn ghost" onclick="location.reload()">re-run</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script>
  const d3 = window.d3;
  const cv = document.getElementById("cv");
  const capEl = document.getElementById("cap");
  const ctlEl = document.getElementById("ctl");
  const errEl = document.getElementById("err");
  window.addEventListener("error", (ev) => { errEl.textContent = "⚠ " + ev.message; errEl.style.display = "block"; });

  const W = innerWidth, H = innerHeight;
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);

  const NAME = "MUHAMMED FAHIM";
  let done = false;
  function finish() {
    if (done) return; done = true;
    capEl.textContent = "identity captured ✓";
    capEl.classList.add("show");
    ctlEl.classList.add("show");
  }

  function sampleName() {
    const oc = document.createElement("canvas");
    oc.width = W; oc.height = H;
    const g = oc.getContext("2d");
    g.fillStyle = "#000";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.font = "800 " + Math.round(H * 0.17) + "px Syne, sans-serif";
    g.fillText(NAME, W / 2, H * 0.5);
    const d = g.getImageData(0, 0, W, H).data;
    const pts = [];
    const stride = 6;
    for (let y = 0; y < H; y += stride) {
      for (let x = 0; x < W; x += stride) {
        if (d[(y * W + x) * 4 + 3] > 120) pts.push([x, y]);
      }
    }
    return pts;
  }

  function run() {
    const targets = sampleName();
    if (targets.length < 90) { finish(); return; }
    const N = 520;
    const nodes = [];
    for (let i = 0; i < N; i++) {
      const t = targets[i % targets.length];
      const ang = Math.random() * Math.PI * 2;
      const r = Math.max(W, H) * (0.5 + Math.random() * 0.9);
      nodes.push({ tx: t[0], ty: t[1], x: W / 2 + Math.cos(ang) * r, y: H / 2 + Math.sin(ang) * r });
    }

    let t0 = performance.now();
    let raf = 0;

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#0b0f0c";
      ctx.fillRect(0, 0, W, H);
    }

    function visual() {
      for (const n of nodes) {
        ctx.fillStyle = "rgba(195,237,192,.9)";
        ctx.fillRect(n.x - 1.3, n.y - 1.3, 2.6, 2.6);
      }
    }

    if (d3 && d3.forceSimulation) {
      const sim = d3.forceSimulation(nodes)
        .force("x", d3.forceX(n => n.tx).strength(0.055))
        .force("y", d3.forceY(n => n.ty).strength(0.055))
        .force("collide", d3.forceCollide(2.7).strength(0.7))
        .velocityDecay(0.55)
        .alpha(1)
        .alphaDecay(0.012)
        .stop();

      function frame() {
        const el = performance.now() - t0;
        sim.tick();
        draw();
        visual();
        if (sim.alpha() < 0.04 || el > 6200) {
          for (let k = 0; k < 40; k++) sim.tick();
          draw(); visual();
          sim.stop();
          finish();
          return;
        }
        raf = requestAnimationFrame(frame);
      }
      raf = requestAnimationFrame(frame);
    } else {
      const st = targets.length;
      nodes.forEach((n, i) => { n._d = (i % st) / st * 900; n._s = 900; });
      t0 = performance.now();
      function ff(now) {
        const el = now - t0;
        draw();
        for (const n of nodes) {
          const u = Math.min(1, (el - n._d) / n._s);
          const e = u <= 0 ? 0 : 1 - Math.pow(1 - u, 3);
          ctx.fillStyle = "rgba(195,237,192,.9)";
          ctx.fillRect(n.x + (n.tx - n.x) * e - 1.3, n.y + (n.ty - n.y) * e - 1.3, 2.6, 2.6);
        }
        if (nodes.every(n => (el - n._d) / n._s >= 1)) { finish(); return; }
        raf = requestAnimationFrame(ff);
      }
      raf = requestAnimationFrame(ff);
    }
  }

  Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1000))]).then(run);
  setTimeout(() => { if (!done) finish(); }, 9000);
  </script>
</body>
</html>
