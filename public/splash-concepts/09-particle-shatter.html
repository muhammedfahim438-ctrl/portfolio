<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concept 09 · Particle Shatter</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{ --bg:#0a0e0b; --ink:#eef3ec; --muted:#93a093; --accent:#aac8a7; --acc2:#c3edc0; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;overflow:hidden;cursor:crosshair}
  .hud{position:fixed;top:22px;left:24px;z-index:6;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
  .hud a{color:var(--muted);text-decoration:none}
  .hud a:hover{color:var(--acc2)}
  canvas{position:fixed;inset:0;z-index:1}
  .hint{position:fixed;top:22px;right:26px;z-index:6;font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;opacity:0;animation:blink 2.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  .start{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:7;display:none;gap:14px;align-items:center;font-family:'JetBrains Mono',monospace}
  .start button{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;color:var(--bg);background:var(--acc2);border:none;border-radius:99px;padding:11px 22px;cursor:pointer}
  .start a{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);text-decoration:none}
  .start a:hover{color:var(--acc2)}
</style>
</head>
<body>
  <div class="hud"><a href="index.html">⬅ All concepts</a>&nbsp;&nbsp;/&nbsp;&nbsp;CONCEPT 09 · PARTICLE SHATTER</div>
  <div class="hint" id="hint">move your cursor through the name</div>
  <canvas id="cv"></canvas>
  <div class="start" id="start">
    <button onclick="location.reload()">Replay</button>
    <a href="index.html">other concepts</a>
  </div>

  <script>
  (async () => {
    try { if (document.fonts?.load) await document.fonts.load("800 120px Syne"); } catch (e) {}

    const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
    let W, H, dpr;
    const mouse = { x: -1e4, y: -1e4 };
    let P = [], forming = false;

    function resize() {
      dpr = Math.min(devicePixelRatio, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      cv.style.width = W + "px"; cv.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildParticles();
    }

    function sampleText() {
      const fs = Math.min(W * .085, 150);
      const off = document.createElement("canvas");
      off.width = Math.floor(innerWidth); off.height = Math.floor(innerHeight);
      const o = off.getContext("2d");
      o.textAlign = "center"; o.textBaseline = "middle";
      o.font = `800 ${fs}px Syne, sans-serif`;
      o.fillStyle = "#fff";
      o.fillText("MUHAMMED FAHIM M", W / 2, H / 2);
      return o.getImageData(0, 0, off.width, off.height);
    }

    function buildParticles() {
      const data = sampleText();
      const gap = 7;
      P = [];
      for (let y = 0; y < H; y += gap)
        for (let x = 0; x < W; x += gap) {
          if (data.data[(y * W + x) * 4 + 3] > 128) {
            P.push({
              tx: x + (Math.random() - .5) * 6,
              ty: y + (Math.random() - .5) * 6,
              x: x + (Math.random() - .5) * innerWidth * 1.6,
              y: innerHeight * 1.5 + Math.random() * innerHeight * .6,
              vx: 0, vy: 0
            });
          }
        }
    }

    function gather(i, str) {
      const p = P[i];
      const ax = (p.tx - p.x) * str * .02;
      const ay = (p.ty - p.y) * str * .02;
      p.vx += ax; p.vy += ay;
      p.vx *= .86; p.vy *= .86;
    }

    function repel(i) {
      const p = P[i];
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const d2 = dx * dx + dy * dy, r = 130;
      if (d2 < r * r) {
        const d = Math.sqrt(d2) || 1;
        const f = (r - d) / r;
        p.vx += (dx / d) * f * 9;
        p.vy += (dy / d) * f * 9;
      }
    }

    addEventListener("resize", resize);
    addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    addEventListener("touchmove", e => {
      const t = e.touches[0]; mouse.x = t.clientX; mouse.y = t.clientY;
    }, { passive: true });

    resize();
    setTimeout(() => forming = true, 600);
    setTimeout(() => document.getElementById("hint").style.opacity = 1, 1600);

    (function loop() {
      requestAnimationFrame(loop);
      ctx.fillStyle = "rgba(10,14,11,1)";
      ctx.fillRect(0, 0, W, H);
      const str = forming ? 1 : 0;
      const step = P.length > 12000 ? 2 : 1;
      for (let i = 0; i < P.length; i += step) {
        const p = P[i];
        gather(i, str);
        if (forming) repel(i);
        p.x += p.vx; p.y += p.vy;
        ctx.fillStyle = forming
          ? `rgba(195,237,192,${.45 + Math.random() * .5})`
          : "rgba(170,200,167,.5)";
        ctx.fillRect(p.x, p.y, 1.9, 1.9);
      }
    })();

    setTimeout(() => document.getElementById("start").style.display = "flex", 5200);
  })();
  </script>
</body>
</html>
