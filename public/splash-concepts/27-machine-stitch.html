<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concept 27 · Machine Stitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<style>
  :root{ --ink:#12150f; --accent:#aac8a7; --acc2:#c3edc0; --text:#eef3ea; --muted:#6d8a70; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;cursor:default}
  .hud{position:fixed;top:22px;left:24px;z-index:30;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
  .hud a{color:var(--muted);text-decoration:none}.hud a:hover{color:var(--acc2)}
  .bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(60% 50% at 50% 45%, rgba(170,200,167,.07), transparent 70%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.013) 0 1px, transparent 1px 3px)}
  #svgLayer{position:fixed;inset:0;z-index:5;pointer-events:none;width:100%;height:100%}
  .namewrap{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:0 4vw}
  .textline{display:flex;gap:.06em}
  .char{font-family:'Syne',sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(2.2rem,9vw,5.6rem);color:var(--muted);opacity:.4;transition:color .25s ease,opacity .25s ease,text-shadow .25s ease}
  .char.on{color:var(--text);opacity:1;text-shadow:0 0 26px rgba(195,237,192,.45)}
  .char.stat{color:var(--text);opacity:1}
  .sub{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.38em;text-transform:uppercase;color:var(--muted);margin-top:34px;opacity:.8}
  .ctl{display:flex;gap:14px;margin-top:26px;opacity:0;transition:opacity .6s ease}
  .ctl.show{opacity:1}
  .btn{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);background:var(--acc2);border:none;border-radius:99px;padding:12px 22px;cursor:pointer;text-decoration:none}
  .btn.ghost{color:var(--muted);background:transparent;border:1px solid rgba(170,200,167,.3)}
  .err{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:40;display:none;font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:.16em;color:#ffb4a6;background:rgba(40,12,8,.85);border:1px solid rgba(255,120,90,.4);border-radius:8px;padding:8px 14px;max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001s !important;transition-duration:.001s !important}}
</style>
</head>
<body>
  <div class="hud"><a href="index.html">⬅ All concepts</a>&nbsp;&nbsp;/&nbsp;&nbsp;CONCEPT 27 · MACHINE STITCH</div>
  <div class="bgfx"></div>
  <svg id="svgLayer"></svg>
  <div class="err" id="err"></div>

  <div class="namewrap">
    <div class="textline" id="textline"></div>
    <div class="sub" id="sub">needle in motion · thread reserved</div>
    <div class="ctl" id="ctl">
      <a class="btn" href="index.html">all concepts</a>
      <button class="btn ghost" onclick="location.reload()">re-stitch</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.4/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MotionPathPlugin.min.js"></script>
  <script>
  const NAME = "MUHAMMED FAHIM";
  const line = document.getElementById("textline");
  const sub = document.getElementById("sub");
  const ctlEl = document.getElementById("ctl");
  const errEl = document.getElementById("err");

  const chars = [...NAME].map((c) => {
    const s = document.createElement("span");
    s.className = "char";
    s.textContent = c;
    line.appendChild(s);
    return s;
  });

  function showErr(msg) {
    errEl.textContent = "⚠ " + msg;
    errEl.style.display = "block";
  }
  window.addEventListener("error", (ev) => showErr(String(ev.message || "script error")));

  let finished = false, svgDone = false;
  function staticReveal(label) {
    if (finished) return; finished = true;
    if (!svgDone) { try { const l = document.getElementById("svgLayer"); while (l.firstChild) l.removeChild(l.firstChild); } catch (e) {} }
    chars.forEach(el => el.classList.add("stat"));
    sub.textContent = label + " · welcome ✓";
    ctlEl.classList.add("show");
  }

  function buildTrail() {
    const svg = window.SVG().addTo("#svgLayer").size("100%","100%").attr({ overflow: "visible" });
    const pts = chars.map((el, i) => {
      const r = el.getBoundingClientRect();
      return [r.left + r.width / 2, r.top + r.height / 2 + Math.sin(i * 1.7) * 7];
    });
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    svg.path(d).stroke({ color: "rgba(195,237,192,.5)", width: 1.6, dasharray: "3 6" }).fill("none");
    const punctures = pts.map(p => svg.circle(5).center(p[0], p[1]).attr({ fill: "#1a2015", stroke: "rgba(195,237,192,.6)", "stroke-width": 1.2 }));
    const needle = svg.circle(11).center(pts[0][0], pts[0][1]).attr({ fill: "#c3edc0", stroke: "#0d120e", "stroke-width": 1.5 });
    svg.circle(3.2).center(pts[0][0], pts[0][1]).attr({ fill: "#0d120e" });
    svgDone = true;
    return { pts, punctures, needle };
  }

  function run() {
    const gsap = window.gsap, MPP = window.MotionPathPlugin;
    if (gsap) gsap.registerPlugin(MPP);
    if (typeof window.SVG !== "function") { staticReveal("stitcher offline"); return; }
    if (!gsap || !MPP) { staticReveal("loom offline"); return; }

    let model = null;
    try { model = buildTrail(); } catch (e) { showErr("draw: " + e.message); staticReveal("thread tangled"); return; }
    setTimeout(() => { if (!finished) staticReveal("thread secured"); }, 7200);

    sub.textContent = "sewing identity…";
    let lastIdx = -1;
    gsap.to(model.needle.node, {
      motionPath: { path: model.pts, align: "none" },
      duration: 3.4, ease: "none",
      onUpdate() {
        const idx = Math.floor(this.progress * NAME.length);
        if (idx !== lastIdx) {
          lastIdx = idx;
          if (idx >= 0 && idx < chars.length) {
            chars[idx].classList.add("on");
            if (model.punctures[idx]) try { model.punctures[idx].attr({ fill: "#c3edc0" }); } catch (e) {}
          }
        }
      },
      onComplete() { staticReveal("thread secured"); }
    });
  }

  Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1400))]).then(() => requestAnimationFrame(run));
  addEventListener("resize", () => { if (finished) { try { buildTrail(); chars.forEach(el => el.classList.add("on")); } catch (e) {} } });
  setTimeout(() => { if (!finished) staticReveal("thread secured"); }, 5200);
  </script>
</body>
</html>
