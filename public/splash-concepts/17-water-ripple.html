<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concept 17 · Water Ripple</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{ --bg:#0a130d; --ink:#eef3ec; --muted:#93a093; --accent:#aac8a7; --acc2:#c3edc0; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;overflow:hidden;cursor:crosshair;user-select:none}
  .hud{position:fixed;top:22px;left:24px;z-index:6;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
  .hud a{color:var(--muted);text-decoration:none}
  .hud a:hover{color:var(--acc2)}
  canvas{position:fixed;inset:0;z-index:1;display:block}
  .hint{position:fixed;bottom:26vh;left:50%;transform:translateX(-50%);text-align:center;z-index:5;font-family:'Inter',sans-serif;font-weight:300;font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);opacity:.55;animation:blink 3s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:.8}}
  .meta{position:fixed;right:28px;bottom:24px;text-align:right;z-index:5;font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);opacity:0;line-height:1.8}
  .start{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:6;display:none;gap:14px;align-items:center}
  .start button{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;color:var(--bg);background:var(--acc2);border:none;border-radius:99px;padding:11px 22px;cursor:pointer}
  .start a{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);text-decoration:none}
  .start a:hover{color:var(--acc2)}
</style>
</head>
<body>
  <div class="hud"><a href="index.html">⬅ All concepts</a>&nbsp;&nbsp;/&nbsp;&nbsp;CONCEPT 17 · WATER RIPPLE</div>
  <canvas id="cv"></canvas>
  <div class="hint">tap the water</div>
  <div class="meta" id="meta">muhammed fahim m &middot; stir it softly</div>

  <div class="start" id="start">
    <button onclick="location.reload()">Replay</button>
    <a href="index.html">other concepts</a>
  </div>

  <script>
  (async () => {
    try { if (document.fonts?.load) await document.fonts.load("800 110px Syne"); } catch (e) {}
    const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
    const S = 6;                                  /* work-space shrink */
    let W, H, bw, bh, base, baseData, outData;

    const ripples = [];
    let ambient = 0;

    function resize() {
      W = innerWidth; H = innerHeight;
      bw = Math.ceil(W / S); bh = Math.ceil(H / S);
      cv.width = W; cv.height = H;
      base = document.createElement("canvas");
      base.width = bw; base.height = bh;
      const b = base.getContext("2d");
      b.clearRect(0, 0, bw, bh);
      const fs = Math.min(bw * .16, bh * .5);
      b.textAlign = "center"; b.textBaseline = "middle";
      b.font = `800 ${fs}px Syne, sans-serif`;
      /* layered underwater text for depth */
      b.globalAlpha = .28; b.fillStyle = "#c3edc0";
      b.fillText("MUHAMMED FAHIM M", bw / 2, bh / 2 - fs * .05);
      b.globalAlpha = .18; b.fillStyle = "#aac8a7"; b.font = `800 ${fs * 1.18}px Syne, sans-serif`;
      b.fillText("MUHAMMED FAHIM M", bw / 2, bh / 2 - fs * .12);
      b.globalAlpha = .85; b.fillStyle = "#f2f9ef"; b.font = `800 ${fs}px Syne, sans-serif`;
      b.fillText("MUHAMMED FAHIM M", bw / 2, bh / 2);
      b.globalAlpha = 1;
      b.filter = "blur(1px)";
      baseData = b.getImageData(0, 0, bw, bh).data;
      outData = b.createImageData(bw, bh);
    }

    addEventListener("resize", resize);
    addEventListener("pointerdown", e => {
      ripples.push({ x: e.clientX / S, y: e.clientY / S, t: 0 });
      if (ripples.length > 8) ripples.shift();
      setTimeout(() => document.getElementById("meta").animate(
        [{ opacity: 0 }, { opacity: 1 }], { duration: 600, fill: "forwards" }), 700);
    });
    addEventListener("touchstart", e => {
      const t = e.touches[0];
      ripples.push({ x: t.clientX / S, y: t.clientY / S, t: 0 });
      if (ripples.length > 8) ripples.shift();
    }, { passive: true });

    resize();

    /* gentle ambient ripples so it feels alive before you interact */
    setInterval(() => {
      ambient++;
      if (ambient > 3) return;
      ripples.push({ x: bw * (.2 + Math.random() * .6), y: bh * (.3 + Math.random() * .4), t: 0 });
      if (ripples.length > 8) ripples.shift();
    }, 1800);

    setTimeout(() => document.getElementById("meta").style.opacity = 1, 6000);

    const wave = document.createElement("canvas");
    wave.width = bw; wave.height = bh;
    const wctx = wave.getContext("2d");
    let last = performance.now();
    const t0 = last;

    (function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(50, (now - last) / 1000); last = now;

      for (let i = ripples.length - 1; i >= 0; i--) {
        ripples[i].t += dt * 1.8;
        if (ripples[i].t > 6) ripples.splice(i, 1);
      }

      /* nothing moving? static calm water */
      if (ripples.length === 0) { ctx.drawImage(base, 0, 0, W, H); return; }

      const out = outData.data, src = baseData;
      for (let y = 0; y < bh; y++) {
        for (let x = 0; x < bw; x++) {
          let dx = 0, dy = 0;
          for (let r = 0; r < ripples.length; r++) {
            const rip = ripples[r];
            const rx = x - rip.x, ry = y - rip.y;
            const d = Math.sqrt(rx * rx + ry * ry);
            if (d < 150 && d > 0.001) {
              const k = 1 - d / 150;
              const fade = 1 - rip.t / 6;
              const amp = Math.sin(d * .22 - rip.t * 3.4) * 3.4 * k * Math.exp(-d * .012) * fade;
              dx += (rx / d) * amp;
              dy += (ry / d) * amp;
              dx += (rx / d) * Math.sin(d * .09 - rip.t * 1.1) * .6 * k * fade;
              dy += (ry / d) * Math.sin(d * .09 - rip.t * 1.1) * .6 * k * fade;
            }
          }
          const sx = Math.max(0, Math.min(bw - 1, x + dx));
          const sy = Math.max(0, Math.min(bh - 1, y + dy));
          const si = (sy * bw + sx) * 4, di = (y * bw + x) * 4;
          out[di] = src[si]; out[di + 1] = src[si + 1]; out[di + 2] = src[si + 2]; out[di + 3] = 255;
        }
      }

      wctx.putImageData(outData, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(wave, 0, 0, W, H);

      if (now - t0 > 2600) document.getElementById("start").style.display = "flex";
    })(performance.now());
  })();
  </script>
</body>
</html>
