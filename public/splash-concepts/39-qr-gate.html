<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concept 39 · QR Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<style>
  :root{ --ink:#0c100c; --qr:#dfe8da; --acc:#c3edc0; --acc2:#9ccf9a; --muted:#68775f; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--ink);color:#eef3ea;font-family:'Inter',sans-serif;overflow:hidden;cursor:default}
  .hud{position:fixed;top:22px;left:24px;z-index:30;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
  .hud a{color:var(--muted);text-decoration:none}.hud a:hover{color:var(--acc)}
  .stage{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .gate{position:relative;opacity:0;transform:scale(.96)}
  .gate.on{opacity:1;transform:none;transition:opacity .6s ease,transform .5s ease}
  #qr{display:block;background:#0f140f;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .frame{position:absolute;inset:-14px;pointer-events:none;border:1px dashed rgba(200,235,200,.14)}
  .frame i{position:absolute;width:22px;height:22px;border:2px solid var(--muted);transition:border-color .6s ease}
  .frame i:nth-child(1){top:-4px;left:-4px;border-right:0;border-bottom:0}
  .frame i:nth-child(2){top:-4px;right:-4px;border-left:0;border-bottom:0}
  .frame i:nth-child(3){bottom:-4px;left:-4px;border-right:0;border-top:0}
  .frame i:nth-child(4){bottom:-4px;right:-4px;border-left:0;border-top:0}
  .gate.ok .frame i{border-color:var(--acc)}
  .read{position:absolute;top:-26px;right:0;font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
  .meta{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-top:26px;opacity:0}
  .meta.show{opacity:1;transition:opacity .6s ease}
  .cap{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.32em;text-transform:uppercase;color:var(--acc);margin-top:12px;opacity:0}
  .cap.show{opacity:1;transition:opacity .6s ease}
  .ctl{display:flex;gap:14px;margin-top:24px;opacity:0}
  .ctl.show{opacity:1;transition:opacity .6s ease}
  .btn{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);background:var(--acc);border:none;border-radius:99px;padding:12px 22px;cursor:pointer;text-decoration:none}
  .btn.ghost{color:var(--muted);background:transparent;border:1px solid rgba(170,200,167,.3)}
  .err{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:40;display:none;font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.14em;color:#ffb4a6;background:rgba(40,12,8,.85);border:1px solid rgba(255,120,90,.4);border-radius:8px;padding:8px 14px;max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (prefers-reduced-motion: reduce){*{transition-duration:.001s !important;animation-duration:.001s !important}}
</style>
</head>
<body>
  <div class="hud"><a href="index.html">⬅ All concepts</a>&nbsp;&nbsp;/&nbsp;&nbsp;CONCEPT 39 · QR GATE</div>
  <div class="err" id="err"></div>

  <div class="stage">
    <div class="gate" id="gate">
      <div class="frame"><i></i><i></i><i></i><i></i></div>
      <div class="read" id="read">decoding…</div>
      <canvas id="qr" width="340" height="340"></canvas>
    </div>
    <div class="meta" id="meta">hello · developer · salaam</div>
    <div class="cap" id="cap"></div>
    <div class="ctl" id="ctl">
      <a class="btn" href="index.html">all concepts</a>
      <button class="btn ghost" onclick="location.reload()">re-scan</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script>
  const qrc = window.qrcode;
  const cv = document.getElementById("qr");
  const cx = cv.getContext("2d");
  const gateEl = document.getElementById("gate");
  const readEl = document.getElementById("read");
  const metaEl = document.getElementById("meta");
  const capEl = document.getElementById("cap");
  const ctlEl = document.getElementById("ctl");
  const errEl = document.getElementById("err");
  window.addEventListener("error", (ev) => { errEl.textContent = "⚠ " + ev.message; errEl.style.display = "block"; });

  const NAME = "MUHAMMED FAHIM";
  const SIZE = 340;
  let done = false;
  function finish() {
    if (done) return; done = true;
    gateEl.classList.add("ok");
    readEl.textContent = "identity verified";
    metaEl.classList.add("show");
    capEl.textContent = "code decoded · welcome ✓";
    capEl.classList.add("show");
    ctlEl.classList.add("show");
  }

  function sampleName() {
    const oc = document.createElement("canvas");
    oc.width = SIZE; oc.height = SIZE;
    const g = oc.getContext("2d");
    g.fillStyle = "#000";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.font = "800 " + Math.round(SIZE * 0.16) + "px Syne, sans-serif";
    g.fillText("MUHAMMED", SIZE / 2, SIZE * 0.38);
    g.fillText("FAHIM", SIZE / 2, SIZE * 0.64);
    const d = g.getImageData(0, 0, SIZE, SIZE).data;
    const targets = [];
    const stride = 4;
    for (let y = 0; y < SIZE; y += stride) {
      for (let x = 0; x < SIZE; x += stride) {
        if (d[(y * SIZE + x) * 4 + 3] > 120) targets.push([x, y]);
      }
    }
    return targets;
  }

  function color(parts) {
    const c = Array.isArray(parts) ? parts : [parts, parts, parts];
    return "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")";
  }
  const C_QR = [223, 232, 218];
  const C_END = [195, 237, 192];

  function scan() {
    gateEl.classList.add("on");
    let modules = [];
    let targets = sampleName();
    if (qrc) {
      try {
        const q = qrc(0, "L");
        q.addData(NAME);
        q.make();
        const m = q.getModuleCount();
        const ms = SIZE / m;
        for (let r = 0; r < m; r++) for (let c = 0; c < m; c++) if (q.isDark(r, c)) modules.push([c * ms, r * ms, ms]);
      } catch (e) { modules = []; }
    }
    if (!modules.length) modules = targets.map(([x, y]) => [x - 2, y - 2, 5]);

    let t = performance.now();
    const SCAN_DONE = 1600;
    const MORPH_START = 2400;
    const DUR = 1300;

    function frame(now) {
      const el = now - t;
      cx.clearRect(0, 0, SIZE, SIZE);
      cx.fillStyle = "#0f140f";
      if (el < SCAN_DONE + 260) {
        cx.fillRect(0, 0, SIZE, SIZE);
        for (const [mx, my, msz] of modules) {
          cx.fillStyle = color([C_QR[0], C_QR[1], C_QR[2]]);
          cx.fillRect(mx + 1, my + 1, msz - 2, msz - 2);
        }
        const p = Math.min(1, el / SCAN_DONE);
        cx.fillStyle = "rgba(195,237,192,.55)";
        cx.fillRect(0, (p * SIZE) - 2, SIZE, 3);
        if (el >= SCAN_DONE) {
          readEl.textContent = "reading matrix…";
        }
      }
      if (el >= MORPH_START) {
        if (el >= MORPH_START && el < MORPH_START + 60) readEl.textContent = "resolving identity…";
        const u = Math.min(1, (el - MORPH_START) / DUR);
        const ease = 1 - Math.pow(1 - u, 3);
        let n = targets.length;
        modules.forEach((mod, i) => {
          const tx = targets[i % n][0], ty = targets[i % n][1];
          const mx = mod[0] + (tx - mod[0]) * ease;
          const my = mod[1] + (ty - mod[1]) * ease;
          const jp = 1 + Math.sin(i * 12.989 + ease * 40) * 0.06;
          cx.fillStyle = color([C_QR[0] + (C_END[0] - C_QR[0]) * ease, C_QR[1] + (C_END[1] - C_QR[1]) * ease, C_QR[2] + (C_END[2] - C_QR[2]) * ease]);
          cx.fillRect(mx + 1, my + 1, (mod[2] - 2) * jp, (mod[2] - 2) * jp);
        });
        if (u >= 1) { finish(); return; }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    setTimeout(finish, 5200);
  }

  Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1000))]).then(scan);
  setTimeout(() => { if (!done) finish(); }, 6600);
  </script>
</body>
</html>
