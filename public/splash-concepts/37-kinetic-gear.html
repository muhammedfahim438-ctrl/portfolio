<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concept 37 · Kinetic Gear</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<style>
  :root{ --ink:#0b0f0c; --accent:#aac8a7; --acc2:#c3edc0; --muted:#5f725e; --dim:#25322a; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--ink);color:#eef3ea;font-family:'Inter',sans-serif;overflow:hidden;cursor:default}
  .hud{position:fixed;top:22px;left:24px;z-index:30;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
  .hud a{color:var(--muted);text-decoration:none}.hud a:hover{color:var(--acc2)}
  #gearzone{position:fixed;top:6%;left:50%;transform:translateX(-50%);width:min(720px,94vw);z-index:5}
  #gearzone canvas{width:100%;height:auto;display:block;opacity:.96}
  .nm{font-family:'Syne',sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(2rem,8vw,4.6rem);letter-spacing:.03em;color:#eef3ea;text-align:center;line-height:1;position:fixed;top:57%;left:0;right:0;z-index:10;opacity:0;transform:translateY(14px);text-shadow:0 0 40px rgba(170,200,167,.25)}
  .nm.on{opacity:1;transform:none;transition:opacity 1s ease,transform .9s ease}
  .cap{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);z-index:12;font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);text-align:center;opacity:0;white-space:nowrap}
  .cap.show{opacity:1;transition:opacity .6s ease}
  .ctl{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);z-index:12;display:flex;gap:14px;opacity:0}
  .ctl.show{opacity:1;transition:opacity .6s ease}
  .btn{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);background:var(--acc2);border:none;border-radius:99px;padding:12px 22px;cursor:pointer;text-decoration:none}
  .btn.ghost{color:var(--muted);background:transparent;border:1px solid rgba(170,200,167,.3)}
  .err{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:40;display:none;font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.14em;color:#ffb4a6;background:rgba(40,12,8,.85);border:1px solid rgba(255,120,90,.4);border-radius:8px;padding:8px 14px;max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (prefers-reduced-motion: reduce){*{transition-duration:.001s !important;animation-duration:.001s !important}}
</style>
</head>
<body>
  <div class="hud"><a href="index.html">⬅ All concepts</a>&nbsp;&nbsp;/&nbsp;&nbsp;CONCEPT 37 · KINETIC GEAR</div>
  <div class="err" id="err"></div>
  <div id="gearzone"><canvas id="zc" width="720" height="430"></canvas></div>
  <div class="nm" id="nm">MUHAMMED&nbsp;FAHIM</div>
  <div class="cap" id="cap">winding mainspring…</div>
  <div class="ctl" id="ctl">
    <a class="btn" href="index.html">all concepts</a>
    <button class="btn ghost" onclick="location.reload()">re-wind</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/zdog@1.1.3/dist/zdog.dist.min.js"></script>
  <script>
  const Z = window.Zdog;
  const nmEl = document.getElementById("nm");
  const capEl = document.getElementById("cap");
  const ctlEl = document.getElementById("ctl");
  const errEl = document.getElementById("err");
  window.addEventListener("error", (ev) => { errEl.textContent = "⚠ " + ev.message; errEl.style.display = "block"; });

  let done = false;
  function complete(label) {
    if (done) return; done = true;
    nmEl.classList.add("on");
    capEl.textContent = label || "calibrated · meshing gears";
    capEl.classList.add("show");
    ctlEl.classList.add("show");
  }

  (function gears() {
    if (!Z) { setTimeout(complete, 900); return; }
    let illo, raf;
    try {
      illo = new Zdog.Illustration({ element: "#zc", zoom: 1 });
    } catch (e) { complete(); return; }

    const TAU = Math.PI * 2;
    function gear(opts) {
      const g = new Zdog.Anchor({ addTo: illo });
      const hub = new Zdog.Cylinder({ addTo: g, diameter: 74, length: 26, stroke: false, color: opts.hub, backface: opts.back });
      for (let i = 0; i < opts.teeth; i++) {
        const t = new Zdog.Shape({ addTo: g, stroke: 12, color: i % 2 ? opts.edge : opts.face,
          path: [{ x: opts.r }, { x: opts.r + opts.tlen }], rotate: { z: (i / opts.teeth) * TAU } });
      }
      const rim = new Zdog.Ellipse({ addTo: g, diameter: opts.r * 2, stroke: 9, color: opts.face, fill: false });
      return g;
    }
    const A1 = "#c3edc0", B1 = "#3c7a4a", C1 = "#0c1710";
    const big = gear({ teeth: 12, r: 96, tlen: 20, hub: A1, back: C1, face: B1, edge: "#68a76f" });
    const sm1 = gear({ teeth: 8, r: 60, tlen: 15, hub: "#19301f", back: C1, face: A1, edge: "#9fd9a0" });
    const sm2 = gear({ teeth: 8, r: 60, tlen: 15, hub: "#19301f", back: C1, face: A1, edge: "#9fd9a0" });
    big.translate = { x: 0, y: 0, z: 0 };
    sm1.translate = { x: 176, y: 78, z: 18 };
    sm2.translate = { x: -176, y: 78, z: 18 };

    const RATIO = 12 / 8;
    let t = 0;
    function frameloop() {
      t += 0.012;
      big.rotate.z = t * 1.0;
      sm1.rotate.z = -t * RATIO + 0.0006;
      sm2.rotate.z = -t * RATIO;
      sm1.translate.y = 78 + Math.sin(t * 6) * 4;
      sm2.translate.y = 78 + Math.sin(t * 6 + 2) * 4;
      illo.updateRenderGraph();
      if (!done) raf = requestAnimationFrame(frameloop);
    }
    raf = requestAnimationFrame(frameloop);
    setTimeout(complete, 2300);
    setTimeout(() => { if (raf && done) cancelAnimationFrame(raf); }, 2600);
  })();
  setTimeout(() => { if (!done) complete(); }, 6500);
  </script>
</body>
</html>
